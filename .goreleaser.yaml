version: 2

project_name: go-dl

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - format: tar.gz
    # This results in: go-dl_1.0.4_linux_amd64.tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Use zip for windows
    format_overrides:
      - goos: windows
        format: zip

checksum:
  disable: true

release:
  draft: true
  replace_existing_draft: true
  make_latest: true
  mode: replace
  skip_upload: false

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
